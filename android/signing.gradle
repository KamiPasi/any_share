def propsFile = rootProject.file('key.properties')
def props = new Properties()

if (propsFile.canRead()) {
    props.load(new FileInputStream(propsFile))

    android.signingConfigs.sign.with {
        storeFile file(props['KEYSTORE_FILE'])
        storePassword props['KEYSTORE_PASSWORD']
        keyAlias props['KEY_ALIAS']
        keyPassword props['KEY_PASSWORD']
    }
} else {
    // 没有 key.properties 时改用调试签名。要直接用名为 debug 的签名配置，
    // AGP 才会在 debug.keystore 不存在时自动生成（CI 上没有现成的）
    android.buildTypes.all { buildType ->
        buildType.signingConfig = android.signingConfigs.debug
    }
}
